{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<h1>Đăng nhập</h1>

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

  <label for="username">Tên đăng nhập</label>
  <input id="username" name="username" type="text" value="{{ username or '' }}" autocomplete="username" required />

  <label for="password">Mật khẩu</label>
  <div class="password-wrap">
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="button" class="toggle-password" data-target="password">Hiện</button>
  </div>

  <button type="submit">Đăng nhập</button>
</form>

<p class="footer">Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a></p>
{% endblock %}
